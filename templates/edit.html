<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Trip</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='edit.css') }}">
</head>
<body>

<div class="container">

<h1>✏️ Edit Trip — {{ trip['destination'] }}</h1>

<p class="edit-summary">
    Current budget: <strong>₹{{ trip['total_budget'] }}</strong>
    &nbsp;|&nbsp; {{ trip['travelers'] }} traveler(s)
    &nbsp;|&nbsp; {{ trip['total_distance'] or 0 }} km
</p>

<form action="/update_trip" method="POST">

    <input type="hidden" name="from_result" value="1">
    <input type="hidden" name="trip_id" value="{{ trip['id'] }}">
    <input type="hidden" name="destination" value="{{ trip['destination'] }}">
    <input type="hidden" name="total_distance" value="{{ trip['total_distance'] or 0 }}">
    <input type="hidden" name="transport_mode" value="{{ trip['transport_mode'] or 'car' }}">
    <input type="hidden" name="transport_cost" value="{{ trip['transport_cost'] or 0 }}">
    <input type="hidden" name="fuel_type" value="{{ trip['fuel_type'] or 'petrol' }}">
    <input type="hidden" name="fuel_price" value="{{ trip['fuel_price'] or 108.85 }}">
    <input type="hidden" name="fuel_cost" value="{{ trip['fuel_cost'] or 0 }}">
    <input type="hidden" name="food_cost" value="{{ trip['food_cost'] or 0 }}">
    <input type="hidden" name="room_cost" value="{{ trip['room_cost'] or 0 }}">
    <input type="hidden" name="toll_charges" value="{{ trip['toll_charges'] or 0 }}">
    <input type="hidden" name="parking_fee" value="{{ trip['parking_fee'] or 0 }}">
    <input type="hidden" name="vehicle_type" value="{{ trip['vehicle_type'] or 'own' }}">
    <input type="hidden" name="vehicle_rental_cost" value="{{ trip['vehicle_rental_cost'] or 0 }}">
    <input type="hidden" name="places_fee_total" value="{{ trip['places_fee_total'] or 0 }}">

    <label>👥 Travelers</label>
    <input type="number" name="travelers" value="{{ trip['travelers'] }}" min="1" required
           onchange="recalcBudget()">

    <label>💰 Total Budget (₹)</label>
    <input type="number" step="0.01" name="total_budget" id="total_budget"
           value="{{ trip['total_budget'] }}" min="0" required
           onchange="recalcBudget()">

    <label>👤 Cost Per Person (₹)</label>
    <input type="number" step="0.01" name="cost_per_person" id="cost_per_person"
           value="{{ trip['cost_per_person'] or 0 }}" readonly>

    <button type="submit" class="btn">💾 Update Trip</button>
</form>

<a href="/planner" class="back-btn">🔄 Recalculate in Planner</a>
<a href="/trips" class="back-btn" style="background:#6b7280; margin-left:10px;">⬅ Back to Trips</a>

</div>

<script>
function recalcBudget() {
    const travelers = parseInt(document.querySelector('[name=travelers]').value) || 1;
    const budget = parseFloat(document.getElementById('total_budget').value) || 0;
    document.getElementById('cost_per_person').value = (budget / travelers).toFixed(2);
}
</script>

</body>
</html>
