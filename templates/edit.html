<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit {{ trip['destination'] }} · TravelBudget</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='edit.css') }}"></head>
<body><main class="edit-shell"><header class="edit-header"><a href="/trips" class="text-link">← Saved trips</a><span>TravelBudget</span></header><section class="edit-intro"><p class="eyebrow">Update saved trip</p><h1>{{ trip['destination'] }}</h1><p>Change trip details or expense amounts. Your total recalculates automatically.</p></section>
<form class="edit-form" action="/update_trip" method="post"><input type="hidden" name="edit_trip" value="1"><input type="hidden" name="trip_id" value="{{ trip['id'] }}"><section class="form-card"><h2>Trip details</h2><div class="edit-grid"><label>Destination<input name="destination" value="{{ trip['destination'] }}" required></label><label>Travelers<input type="number" name="travelers" id="travelers" min="1" value="{{ trip['travelers'] }}" required></label><label>Distance (km)<input type="number" step=".01" name="total_distance" min="0" value="{{ trip['total_distance'] or 0 }}" required></label><label>Transport<select name="transport_mode"><option value="car" {{ 'selected' if trip['transport_mode'] == 'car' }}>Car</option><option value="bike" {{ 'selected' if trip['transport_mode'] == 'bike' }}>Bike</option><option value="bus" {{ 'selected' if trip['transport_mode'] == 'bus' }}>Bus</option><option value="train" {{ 'selected' if trip['transport_mode'] == 'train' }}>Train</option><option value="flight" {{ 'selected' if trip['transport_mode'] == 'flight' }}>Flight</option><option value="walk" {{ 'selected' if trip['transport_mode'] == 'walk' }}>Walk</option></select></label></div></section>
<section class="form-card"><div class="section-heading"><h2>Budget breakdown</h2><p>Enter totals for the full trip.</p></div><div class="edit-grid"><label>Transport / fuel<input class="cost-input" type="number" step=".01" name="transport_cost" min="0" value="{{ trip['transport_cost'] or 0 }}"></label><label>Food<input class="cost-input" type="number" step=".01" name="food_cost" min="0" value="{{ trip['food_cost'] or 0 }}"></label><label>Stay<input class="cost-input" type="number" step=".01" name="room_cost" min="0" value="{{ trip['room_cost'] or 0 }}"></label><label>Tolls<input class="cost-input" type="number" step=".01" name="toll_charges" min="0" value="{{ trip['toll_charges'] or 0 }}"></label><label>Parking<input class="cost-input" type="number" step=".01" name="parking_fee" min="0" value="{{ trip['parking_fee'] or 0 }}"></label><label>Entry fees<input class="cost-input" type="number" step=".01" name="places_fee_total" min="0" value="{{ trip['places_fee_total'] or 0 }}"></label><label>Vehicle rental<input class="cost-input" type="number" step=".01" name="vehicle_rental_cost" min="0" value="{{ trip['vehicle_rental_cost'] or 0 }}"></label><label>Fuel type<select name="fuel_type"><option value="petrol" {{ 'selected' if trip['fuel_type'] == 'petrol' }}>Petrol</option><option value="diesel" {{ 'selected' if trip['fuel_type'] == 'diesel' }}>Diesel</option></select></label></div><input type="hidden" name="fuel_price" value="{{ trip['fuel_price'] or 0 }}"><input type="hidden" name="fuel_cost" value="{{ trip['fuel_cost'] or 0 }}"><input type="hidden" name="vehicle_type" value="{{ trip['vehicle_type'] or 'own' }}"></section>
<aside class="live-total"><span>Updated total</span><strong id="total_preview">₹0.00</strong><p><span id="per_person_preview">₹0.00</span> per traveler</p></aside><div class="edit-actions"><a href="/trips" class="cancel-btn">Cancel</a><button type="submit">Save changes</button></div></form></main>
<script>const inputs=document.querySelectorAll('.cost-input'),travelers=document.getElementById('travelers'),total=document.getElementById('total_preview'),per=document.getElementById('per_person_preview');function update(){const value=[...inputs].reduce((sum,input)=>sum+(Number(input.value)||0),0),people=Math.max(Number(travelers.value)||1,1);total.textContent=`₹${value.toFixed(2)}`;per.textContent=`₹${(value/people).toFixed(2)}`;}inputs.forEach(input=>input.addEventListener('input',update));travelers.addEventListener('input',update);update();</script></body></html>
