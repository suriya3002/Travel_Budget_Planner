<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create account · TravelBudget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
  </head>
  <body>
    <main class="auth-shell">
      <a class="brand" href="/">TravelBudget</a>
      <section class="auth-card">
        <p class="eyebrow">Start planning</p>
        <h1>Create your account</h1>
        <p class="intro">Save and manage all your trip budgets in one place.</p>

        {% if error %}
          <p class="error">{{ error }}</p>
        {% endif %}

        <form method="post">
          <label>
            Name
            <input type="text" name="name" autocomplete="name" required>
          </label>

          <label>
            Email
            <input type="email" name="email" autocomplete="email" required>
          </label>

          <label>
            Password
            <input type="password" name="password" autocomplete="new-password" minlength="8" required>
          </label>

          <button type="submit">Create account</button>
        </form>

        <p class="switch">Already have an account? <a href="/login">Sign in</a></p>
      </section>
    </main>
  </body>
</html>
