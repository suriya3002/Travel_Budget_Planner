<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · TravelBudget</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"></head>
<body><main class="auth-shell"><a class="brand" href="/">TravelBudget</a><section class="auth-card"><p class="eyebrow">Welcome back</p><h1>Sign in to your trips</h1><p class="intro">Access your saved budgets and keep planning.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="next" value="{{ next_page }}"><label>Email<input type="email" name="email" autocomplete="email" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p class="switch">New to TravelBudget? <a href="/register">Create an account</a></p></section></main></body></html>
