<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign in · TravelBudget</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}"></head>
<body>
<main class="auth-shell">
  <a class="brand" href="/">TravelBudget</a>
  <section class="auth-card">
    <p class="eyebrow">Admin portal</p>
    <h1>Administrator sign in</h1>
    <p class="intro">Sign in with an administrator account to manage members and view trip history.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next_page }}">
      <label>Email
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
    <p class="switch">Not an admin? <a href="/login">Sign in as a member</a></p>
  </section>
</main>
</body></html>
